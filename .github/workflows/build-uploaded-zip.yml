name: Build HOSSEIN AI Android APK
run-name: APK build ${{inputs.build_id}}

on:
  workflow_dispatch:
    inputs:
      source_secret_name:
        description: Encrypted repository secret containing the private ZIP URL
        required: true
        type: string
      build_id:
        description: Unique build identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Download private source ZIP immediately
        env:
          SOURCE_ZIP_URL: ${{secrets[inputs.source_secret_name]}}
        run: |
          set -euo pipefail
          test -n "$SOURCE_ZIP_URL" || { echo 'Missing encrypted source URL secret'; exit 1; }
          echo "::add-mask::$SOURCE_ZIP_URL"
          case "$SOURCE_ZIP_URL" in https://*) ;; *) echo 'HTTPS URL required'; exit 1 ;; esac
          curl --fail --location --retry 3 --silent --show-error "$SOURCE_ZIP_URL" -o "$RUNNER_TEMP/source.zip"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platforms and build tools
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager 'platform-tools' 'platforms;android-34' 'platforms;android-35' 'platforms;android-36' 'build-tools;34.0.0' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Download, validate and detect source project
        env:
          SOURCE_ZIP_URL: ${{secrets[inputs.source_secret_name]}}
        run: |
          set -euo pipefail
          test -n "$SOURCE_ZIP_URL" || { echo 'Missing encrypted source URL secret'; exit 1; }
          echo "::add-mask::$SOURCE_ZIP_URL"
          case "$SOURCE_ZIP_URL" in https://*) ;; *) echo 'HTTPS URL required'; exit 1 ;; esac
          test -s "$RUNNER_TEMP/source.zip" || { echo 'Early source ZIP download is missing'; exit 1; }
          python3 - <<'PY'
          import os, pathlib, stat, sys, zipfile
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source.zip'
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-tree'
          root.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              entries = z.infolist()
              if not entries or len(entries) > 10000: sys.exit('ZIP is empty or contains too many entries')
              if sum(i.file_size for i in entries) > 1024**3: sys.exit('ZIP expands beyond 1 GiB')
              for item in entries:
                  name = pathlib.PurePosixPath(item.filename)
                  if name.is_absolute() or '..' in name.parts: sys.exit('Unsafe ZIP path detected')
                  if stat.S_ISLNK(item.external_attr >> 16): sys.exit('Symbolic links are not allowed in source ZIP')
              bad = z.testzip()
              if bad: sys.exit('Corrupt ZIP entry: ' + bad)
              z.extractall(root)
          flutter = [p.parent for p in root.rglob('pubspec.yaml') if (p.parent / 'android').is_dir()]
          gradle = [p.parent for p in list(root.rglob('settings.gradle')) + list(root.rglob('settings.gradle.kts')) if (p.parent / 'app').is_dir() and any((p.parent / 'app' / n).is_file() for n in ('build.gradle', 'build.gradle.kts'))]
          if flutter:
              project = min(flutter, key=lambda p: len(p.parts))
              kind = 'flutter'
          elif gradle:
              project = min(gradle, key=lambda p: len(p.parts))
              kind = 'gradle'
          else:
              sys.exit('No supported project found: expected Flutter pubspec.yaml + android/ or Android settings.gradle + app module')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('PROJECT_DIR=' + str(project) + '\n')
              env.write('BUILD_KIND=' + kind + '\n')
          print('Detected project type:', kind)
          print('Project directory:', project)
          PY
      - name: Set up Gradle 8.2 for native Android project
        if: env.BUILD_KIND == 'gradle'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Build Flutter release APK
        if: env.BUILD_KIND == 'flutter'
        working-directory: ${{env.PROJECT_DIR}}
        run: |
          set -euo pipefail
          flutter doctor --android-licenses
          flutter pub get
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p "$RUNNER_TEMP/apk-output"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/apk-output/app-release.apk"
      - name: Build native Android release APK
        if: env.BUILD_KIND == 'gradle'
        working-directory: ${{env.PROJECT_DIR}}
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace assembleRelease
          APK_PATH=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          test -n "$APK_PATH" && test -s "$APK_PATH" || { echo 'Release APK was not produced'; exit 1; }
          mkdir -p "$RUNNER_TEMP/apk-output"
          cp "$APK_PATH" "$RUNNER_TEMP/apk-output/app-release.apk"
      - name: Verify APK and print checksum
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/apk-output/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          if ! "$APKSIGNER" verify "$APK" >/dev/null 2>&1; then
            echo 'APK is unsigned; creating an ephemeral test-signing key for this build.'
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/hossein-test.jks" -storepass changeit -keypass changeit -alias hossein-test -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=HOSSEIN AI Test,O=HOSSEIN AI,C=DE'
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/hossein-test.jks" --ks-key-alias hossein-test --ks-pass pass:changeit --key-pass pass:changeit --out "$RUNNER_TEMP/apk-output/app-release-signed.apk" "$APK"
            mv "$RUNNER_TEMP/apk-output/app-release-signed.apk" "$APK"
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{inputs.build_id}}
          path: ${{runner.temp}}/apk-output/app-release.apk
          if-no-files-found: error
          retention-days: 3
