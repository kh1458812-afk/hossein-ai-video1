name: Build APK from uploaded ZIP
run-name: APK build ${{inputs.build_id}}

on:
  workflow_dispatch:
    inputs:
      source_secret_name:
        description: Name of the encrypted repository secret holding the private source URL
        required: true
        type: string
      build_id:
        description: Unique build identifier
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {}
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Download and extract ZIP
        env:
          SOURCE_ZIP_URL: ${{secrets[inputs.source_secret_name]}}
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_ZIP_URL" ]; then echo "Encrypted source URL secret is missing"; exit 1; fi
          echo "::add-mask::$SOURCE_ZIP_URL"
          case "$SOURCE_ZIP_URL" in https://*) ;; *) echo "HTTPS URL required"; exit 1 ;; esac
          mkdir -p "$RUNNER_TEMP/hossein-source"
          curl --fail --location --retry 3 --silent --show-error "$SOURCE_ZIP_URL" -o "$RUNNER_TEMP/source.zip"
          python3 - <<'PY'
          import zipfile, pathlib, sys, os
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "source.zip"
          with zipfile.ZipFile(p) as z:
              infos = z.infolist()
              if len(infos) > 10000: sys.exit("ZIP contains too many entries")
              total = sum(i.file_size for i in infos)
              if total > 1024 * 1024 * 1024: sys.exit("ZIP expands beyond 1 GiB")
              for i in infos:
                  n = pathlib.PurePosixPath(i.filename)
                  if n.is_absolute() or '..' in n.parts: sys.exit("Unsafe ZIP path")
              bad = z.testzip()
              if bad: sys.exit("Corrupt ZIP entry: " + bad)
          PY
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/hossein-source"
          PROJECT_DIR="$(find "$RUNNER_TEMP/hossein-source" -name pubspec.yaml -not -path '*/.dart_tool/*' -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then echo "No pubspec.yaml found in ZIP"; exit 1; fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Ensure Android platform exists
        working-directory: ${{env.PROJECT_DIR}}
        run: |
          if [ ! -d android ]; then flutter create --platforms=android .; fi
      - name: Resolve dependencies
        working-directory: ${{env.PROJECT_DIR}}
        run: flutter pub get
      - name: Analyze source
        working-directory: ${{env.PROJECT_DIR}}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build release APK
        working-directory: ${{env.PROJECT_DIR}}
        run: |
          set -euo pipefail
          flutter build apk --release
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK_PATH"
          mkdir -p "$RUNNER_TEMP/apk-output"
          cp "$APK_PATH" "$RUNNER_TEMP/apk-output/app-release.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{inputs.build_id}}
          path: ${{runner.temp}}/apk-output/app-release.apk
          if-no-files-found: error
          retention-days: 3
